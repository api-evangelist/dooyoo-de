description: Dooyoo was a German consumer product-review and price-comparison platform built on
  user-generated reviews, best known for its "dooyooMiles" rewards program that paid users for writing
  reviews. It was acquired by the French shopping-guide publisher LeGuide.com in 2008, and the LeGuide
  group (Ciao, Dooyoo, and others) was in turn acquired by Kelkoo in 2016 to form Kelkoo Group. The
  dooyoo.de domain no longer operates as an independent brand and now 301-redirects to
  kelkoogroup.com; there is no active developer portal, public API, or documentation surface. This
  profile is retained as a defunct/absorbed portfolio lead with no API artifacts to enrich.
